<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogo Principal - Jogar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Game.css?v=20260323e">
    <script src="RenderMap.js"></script>
    <script src="PlayerGamepad.js"></script>
    <script src="scores.js"></script>
    <script src="enemy.js"></script>
    <script src="survival.js"></script>
    <script src="Nuvens.js"></script>
</head>

<body>

    <a class="btn btn-primary back-button" id="game_back_button" href="../index.php" onclick="window.location.href='../index.php'; return false;">← Voltar </a>

    <div id="collect_box">
        <div id="chests_row" class="collect-row">
            <span class="collect-label">Baús Abertos:</span>
            <span id="chests_value" class="collect-value">/1</span>
        </div>
        <div id="coins_row" class="collect-row">
            <span class="collect-label">Moedas Apanhadas:</span>
            <span id="coins_value" class="collect-value">0/0</span>
        </div>
    </div>

    <div id="score_box">
        <span class="score-label">PONTOS:</span>
        <span id="score_value">0</span>
    </div>

    <!-- Barra de vida do jogador -->

    <!-- 
        FULL.png = vida cheia
        2_1.png = 2 de vida
        1_2.png = 1 de vida
        0.png = sem vida
    -->
        
    <div id="vida_container">
        <img id="barra_vida" src="../src/sprites/main/VIDA/FULL.png" alt="Barra de vida" />
    </div>

    <div id="game_time">TEMPO: 00:00</div>
    <div id="game_notice" aria-live="polite"></div>
    <div id="control_calibration_overlay" class="control-calibration-overlay">
        <div class="control-calibration-box">
            <div class="control-calibration-title">Calibração do P1</div>
            <div class="control-calibration-subtitle">Sem cookies encontrados. Mexe no joystick da arcade e carrega no botão pedido para configurar este browser. Se quiseres usar rato/teclado, clica fora desta caixa.</div>
            <div id="control_calibration_prompt" class="control-calibration-prompt">P1: press up</div>
            <div id="control_calibration_hint" class="control-calibration-hint"></div>
        </div>
    </div>

    <audio id="MainGameMusic"></audio>

    <div id="viewport">
        <div id="map_camera">
            <div id="map">
                <div class="layer" id="layer1"></div>
                <div class="layer" id="layer2"></div>
                <div class="layer" id="layer3"></div>
            </div>
        </div>
    </div>


    <script>

    //spotify da temu
    const MUSICAS = [
        '../src/music/maingame.mp3',
        '../src/music/survival.mp3',
        '../src/music/game2.mp3',
        '../src/music/game3.mp3',
        '../src/music/game4.mp3',
        '../src/music/game5.mp3'
    ];
    
    var IndiceAtualMusica = 0; //indice da musica atual
    
    function PlayNextMusic() { //tocar a proxima musica da playlist
        const mainGameMusic = document.getElementById('MainGameMusic');
        if (!mainGameMusic) return;
        
        mainGameMusic.src = MUSICAS[IndiceAtualMusica];
        mainGameMusic.volume = 0.70; //reduzir 30% o volume
        mainGameMusic.play();
        IndiceAtualMusica = (IndiceAtualMusica + 1) % MUSICAS.length; //avança para a proxima musica da lista e volta ao inicio se tiver acabado a lista
    }
    
    function SetupMusicPlaylist() { //configurar a playlist de musica
        const mainGameMusic = document.getElementById('MainGameMusic');
        if (!mainGameMusic) return;
        
        //a primeira musica e random
        IndiceAtualMusica = Math.floor(Math.random() * MUSICAS.length);
        
        // acaba uma musica e passa a proxima
        mainGameMusic.onended = PlayNextMusic;
        
        //toca a primeira musica
        PlayNextMusic();
    }

    function UpdateMapScale() { //ajustar escala do mapa ao tamanho do ecrã
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('map');
        if (!viewport) return;
        window.MAP_SCALE = viewport.clientHeight / MAP_HEIGHT_PX;
        if (map) {
            map.style.transform = `scale(${window.MAP_SCALE})`;
        }
    }

    const GAMEPAD_COOKIE_NAME = "a17132_arcade_p1";
    const GAMEPAD_SKIP_SESSION_KEY = "a17132_skip_arcade_overlay";
    const ARCADE_EXIT_HREF = "https://www1.cic.pt/~usr21/25-26/expocic26";
    const REQUIRED_GAMEPAD_ACTIONS = ["up", "left", "right", "run", "select", "click", "back", "menu"];
    const GAMEPAD_CALIBRATION_STEPS = [
        { action: "up", prompt: "P1: press up" },
        { action: "left", prompt: "P1: press left" },
        { action: "right", prompt: "P1: press right" },
        { action: "run", prompt: "P1: press run" },
        { action: "select", prompt: "P1: press select" },
        { action: "click", prompt: "P1: press click" },
        { action: "back", prompt: "P1: press return" },
        { action: "menu", prompt: "P1: press menu" }
    ];

    window.arcadeGamepadBindings = null;
    let gamepadCalibrationBindings = null;
    let gamepadCalibrationStepIndex = 0;
    let gamepadCalibrationWaitingNeutral = false;
    const GAMEPAD_INPUT_DEADZONE = 0.55;

    function LerCookie(nome) {
        const cookie = document.cookie
            .split("; ")
            .find(row => row.startsWith(nome + "="));
        return cookie ? decodeURIComponent(cookie.split("=")[1]) : "";
    }

    function GuardarCookie(nome, valor, dias) {
        const expires = new Date();
        expires.setTime(expires.getTime() + dias * 24 * 60 * 60 * 1000);
        document.cookie = `${nome}=${encodeURIComponent(valor)}; expires=${expires.toUTCString()}; path=/; SameSite=Lax`;
    }

    function IgnorarOverlayGamepadNestaSessao() {
        try {
            sessionStorage.setItem(GAMEPAD_SKIP_SESSION_KEY, "1");
        } catch {
        }
    }

    function OverlayGamepadIgnoradoNestaSessao() {
        try {
            return sessionStorage.getItem(GAMEPAD_SKIP_SESSION_KEY) === "1";
        } catch {
            return false;
        }
    }

    function LimparIgnorarOverlayGamepad() {
        try {
            sessionStorage.removeItem(GAMEPAD_SKIP_SESSION_KEY);
        } catch {
        }
    }

    function CarregarGamepadBindingsCookie() {
        const raw = LerCookie(GAMEPAD_COOKIE_NAME);
        if (!raw) return null;

        try {
            const parsed = JSON.parse(raw);
            const valido = REQUIRED_GAMEPAD_ACTIONS.every(function (action) {
                return !!parsed[action];
            });
            return valido ? parsed : null;
        } catch {
            return null;
        }
    }

    function OverlayCalibracaoAtivo() {
        const overlay = document.getElementById("control_calibration_overlay");
        return !!(overlay && overlay.classList.contains("show"));
    }

    function AtualizarPromptCalibracao(mensagem = "") {
        const prompt = document.getElementById("control_calibration_prompt");
        const hint = document.getElementById("control_calibration_hint");
        const step = GAMEPAD_CALIBRATION_STEPS[gamepadCalibrationStepIndex];

        if (prompt && step) {
            prompt.textContent = step.prompt;
        }
        if (hint) {
            hint.textContent = mensagem;
        }
    }

    function MostrarOverlayCalibracao() {
        const overlay = document.getElementById("control_calibration_overlay");
        gamepadCalibrationBindings = {};
        gamepadCalibrationStepIndex = 0;
        gamepadCalibrationWaitingNeutral = false;
        window.gamePaused = true;
        if (overlay) overlay.classList.add("show");
        AtualizarPromptCalibracao("Liga o joystick da arcade e faz o movimento pedido.");
    }

    function FecharOverlayCalibracao() {
        const overlay = document.getElementById("control_calibration_overlay");
        if (overlay) overlay.classList.remove("show");
        if (window.ResetTeclasJogo) {
            window.ResetTeclasJogo();
        }
        window.gamePaused = false;
    }

    function GuardarGamepadBindingsCalibrados() {
        window.arcadeGamepadBindings = gamepadCalibrationBindings;
        LimparIgnorarOverlayGamepad();
        GuardarCookie(GAMEPAD_COOKIE_NAME, JSON.stringify(window.arcadeGamepadBindings), 365);
        AtualizarPromptCalibracao("Controlos guardados.");
        setTimeout(FecharOverlayCalibracao, 200);
    }

    function FecharOverlayCalibracaoComRato() {
        IgnorarOverlayGamepadNestaSessao();
        AtualizarPromptCalibracao("Calibração ignorada nesta sessão.");
        setTimeout(FecharOverlayCalibracao, 120);
    }

    function BindingGamepadKey(binding) {
        return binding.type + ":" + binding.index + ":" + (binding.sign || 0);
    }

    function FormatarBindingGamepad(binding) {
        if (!binding) return "";
        if (binding.type === "axis") {
            if (binding.index === 0 && binding.sign < 0) return "Left";
            if (binding.index === 0 && binding.sign > 0) return "Right";
            if (binding.index === 1 && binding.sign < 0) return "Up";
            if (binding.index === 1 && binding.sign > 0) return "Down";
            return "Axis " + binding.index;
        }
        return "Button " + binding.index;
    }

    function LerInputGamepadCalibracao(action = "") {
        if (!navigator.getGamepads) return null;

        const gamepads = navigator.getGamepads();
        if (!gamepads) return null;

        for (let i = 0; i < gamepads.length; i++) {
            const gamepad = gamepads[i];
            if (!gamepad) continue;

            if (action !== "run" && action !== "select" && action !== "click" && action !== "back" && action !== "menu" && gamepad.axes) {
                for (let axisIndex = 0; axisIndex < gamepad.axes.length; axisIndex++) {
                    const value = gamepad.axes[axisIndex];
                    if (value <= -GAMEPAD_INPUT_DEADZONE) {
                        return { type: "axis", index: axisIndex, sign: -1 };
                    }
                    if (value >= GAMEPAD_INPUT_DEADZONE) {
                        return { type: "axis", index: axisIndex, sign: 1 };
                    }
                }
            }

            if (gamepad.buttons) {
                for (let buttonIndex = 0; buttonIndex < gamepad.buttons.length; buttonIndex++) {
                    const button = gamepad.buttons[buttonIndex];
                    if (button && (button.pressed || button.value > 0.5)) {
                        return { type: "button", index: buttonIndex };
                    }
                }
            }
        }

        return null;
    }

    function GamepadEstaNeutro() {
        return !LerInputGamepadCalibracao();
    }

    function AtualizarCalibracaoGamepad() {
        if (!OverlayCalibracaoAtivo()) return;

        const step = GAMEPAD_CALIBRATION_STEPS[gamepadCalibrationStepIndex];
        const input = LerInputGamepadCalibracao(step ? step.action : "");

        if (!input) {
            if (gamepadCalibrationWaitingNeutral) {
                gamepadCalibrationWaitingNeutral = false;
                AtualizarPromptCalibracao("");
            }
            return;
        }

        if (gamepadCalibrationWaitingNeutral) {
            return;
        }

        if (!gamepadCalibrationBindings) {
            gamepadCalibrationBindings = {};
        }

        if (!step) return;

        const inputKey = BindingGamepadKey(input);
        const existingKeys = Object.values(gamepadCalibrationBindings).map(BindingGamepadKey);

        if (existingKeys.includes(inputKey)) {
            AtualizarPromptCalibracao("Esse movimento já foi usado. Larga o joystick e escolhe outro.");
            gamepadCalibrationWaitingNeutral = true;
            return;
        }

        gamepadCalibrationBindings[step.action] = input;
        gamepadCalibrationStepIndex++;
        gamepadCalibrationWaitingNeutral = true;

        if (gamepadCalibrationStepIndex >= GAMEPAD_CALIBRATION_STEPS.length) {
            GuardarGamepadBindingsCalibrados();
            return;
        }

        AtualizarPromptCalibracao("Guardado: " + FormatarBindingGamepad(input));
    }

    function AcaoArcadeAtiva(action) {
        const bindings = window.arcadeGamepadBindings;
        if (!bindings || !bindings[action] || !navigator.getGamepads) return false;

        const gamepads = navigator.getGamepads();
        if (!gamepads) return false;

        for (let i = 0; i < gamepads.length; i++) {
            const gamepad = gamepads[i];
            if (!gamepad) continue;
            if (typeof BindingGamepadAtivo === "function" && BindingGamepadAtivo(gamepad, bindings[action])) {
                return true;
            }
        }

        return false;
    }

    window.onload = function () { //iniciar o jogo quando a pagina carregar

        //carregar o mapa
        LoadMap(mapa1_layer1, mapa1_layer2, mapa1_layer3);

        //criar o jogador
        const spawn = findPlayerSpawn(mapa1_layer3);
        const player = new Player(spawn.x, spawn.y);

        //inicializar nuvens com parallax
        InitNuvens();

        UpdateMapScale(); //ajustar o mapa ao tamanho do ecrã
        window.addEventListener('resize', UpdateMapScale);

        SetupMusicPlaylist(); //iniciar a musica
        
        //funçao para dar reset as teclas ao ser acionado um botao ou alert
        window.ResetTeclasJogo = function() {
            for (let key in window.keys) {
                window.keys[key] = false;
            }
        };

        const calibrationOverlay = document.getElementById("control_calibration_overlay");
        if (calibrationOverlay) {
            calibrationOverlay.addEventListener("click", function (event) {
                if (event.target === calibrationOverlay) {
                    FecharOverlayCalibracaoComRato();
                }
            });
        }

        const savedBindings = CarregarGamepadBindingsCookie();
        if (savedBindings) {
            window.arcadeGamepadBindings = savedBindings;
        } else if (!OverlayGamepadIgnoradoNestaSessao()) {
            MostrarOverlayCalibracao();
        }
        
        window.gameStartTime = Date.now(); //temporizador do jogo
        const FIXED_STEP = 1000 / 60;
        const MAX_FRAME_DELTA = 100;
        const MAX_UPDATES_PER_FRAME = 3;
        let lastFrameTime = performance.now();
        let accumulator = 0;
        let lastArcadeBackPressed = false;
        let lastArcadeMenuPressed = false;
        let lastArcadeUiLeftPressed = false;
        let lastArcadeUiRightPressed = false;
        let lastArcadeUiSelectPressed = false;
        let lastArcadeUiClickPressed = false;
        let currentArcadeMenuIndex = 0;
        let previousArcadeMenuItems = [];
        const hudState = {
            score: null,
            timeText: "",
            baus: "",
            moedas: "",
            bausComplete: false,
            moedasComplete: false
        };

        function AtualizarHudJogo() {
            const scoreEl = document.getElementById('score_value');
            if (scoreEl && hudState.score !== score) {
                hudState.score = score;
                scoreEl.textContent = score;
            }

            const gameElapsedSeconds = Math.floor((Date.now() - window.gameStartTime) / 1000);
            window.gameElapsedSeconds = gameElapsedSeconds;
            const minutes = String(Math.floor(gameElapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(gameElapsedSeconds % 60).padStart(2, '0');
            const timeText = `TEMPO: ${minutes}:${seconds}`;
            const timeEl = document.getElementById('game_time');
            if (timeEl && hudState.timeText !== timeText) {
                hudState.timeText = timeText;
                timeEl.textContent = timeText;
            }

            const totalBaus = 1;
            const totalBausAbertos = BausAbertos;
            const bausText = totalBausAbertos + "/" + totalBaus;
            const bausValueEl = document.getElementById('chests_value');
            if (bausValueEl && hudState.baus !== bausText) {
                hudState.baus = bausText;
                bausValueEl.textContent = bausText;
            }
            const bausRow = document.getElementById('chests_row');
            const bausComplete = totalBausAbertos == totalBaus;
            if (bausComplete !== hudState.bausComplete) {
                hudState.bausComplete = bausComplete;
                if (bausValueEl) bausValueEl.style.color = bausComplete ? "green" : "";
                if (bausRow) bausRow.classList.toggle('completed', bausComplete);
            }

            const totalMoedasApanhadas = MoedasApanhadas;
            const moedasText = totalMoedasApanhadas + "/" + numMoedas;
            const moedasValueEl = document.getElementById('coins_value');
            if (moedasValueEl && hudState.moedas !== moedasText) {
                hudState.moedas = moedasText;
                moedasValueEl.textContent = moedasText;
            }
            const moedasRow = document.getElementById('coins_row');
            const moedasComplete = totalMoedasApanhadas == numMoedas;
            if (moedasComplete !== hudState.moedasComplete) {
                hudState.moedasComplete = moedasComplete;
                if (moedasValueEl) moedasValueEl.style.color = moedasComplete ? "green" : "";
                if (moedasRow) moedasRow.classList.toggle('completed', moedasComplete);
            }
        }

        function AtualizarPassoJogo() {
            if (!window.gamePaused) {
                player.update(keys);
                updatecamara(player);
                checkCoinPickup(player);
                checkPowerUpPickup(player);
                checkBauPickup(player);
                CheckEnemyTouch(player);
                AtualizarNuvens();
            }
        }

        function AtualizarBotaoReturnArcade() {
            const backPressed = AcaoArcadeAtiva("back");
            if (backPressed && !lastArcadeBackPressed) {
                window.location.href = "../index.php";
            }
            lastArcadeBackPressed = backPressed;

            const menuPressed = AcaoArcadeAtiva("menu");
            if (menuPressed && !lastArcadeMenuPressed) {
                window.location.href = ARCADE_EXIT_HREF;
            }
            lastArcadeMenuPressed = menuPressed;
        }

        function ObterBotoesMenuArcade() {
            const overlay = document.getElementById("win_overlay");
            if (!overlay || !overlay.classList.contains("show")) return [];

            const modalBackdrop = overlay.querySelector(".win-modal-backdrop");
            if (modalBackdrop && modalBackdrop.classList.contains("show")) {
                return Array.from(modalBackdrop.querySelectorAll(".win-btn-form, .win-close-btn")).filter(function (item) {
                    return item && item.offsetParent !== null;
                });
            }

            return Array.from(overlay.querySelectorAll(".win-panel .win-btn-panel")).filter(function (item) {
                return item && item.offsetParent !== null;
            });
        }

        function AtualizarSelecaoMenuArcade(items) {
            previousArcadeMenuItems.forEach(function (item) {
                if (item && !items.includes(item)) {
                    item.classList.remove("arcade-ui-selected");
                }
            });
            previousArcadeMenuItems = items.slice();

            if (!items.length) return;
            if (currentArcadeMenuIndex >= items.length) currentArcadeMenuIndex = 0;
            items.forEach(function (item, index) {
                item.classList.toggle("arcade-ui-selected", index === currentArcadeMenuIndex);
            });
        }

        function AtualizarNavegacaoMenuArcade() {
            const items = ObterBotoesMenuArcade();
            AtualizarSelecaoMenuArcade(items);

            const leftPressed = AcaoArcadeAtiva("left");
            const rightPressed = AcaoArcadeAtiva("right");
            const selectPressed = AcaoArcadeAtiva("select");
            const clickPressed = AcaoArcadeAtiva("click");

            if (items.length > 1 && leftPressed && !lastArcadeUiLeftPressed) {
                currentArcadeMenuIndex = (currentArcadeMenuIndex - 1 + items.length) % items.length;
                AtualizarSelecaoMenuArcade(items);
            }

            if (items.length > 1 && rightPressed && !lastArcadeUiRightPressed) {
                currentArcadeMenuIndex = (currentArcadeMenuIndex + 1) % items.length;
                AtualizarSelecaoMenuArcade(items);
            }

            const activatePressed = (selectPressed && !lastArcadeUiSelectPressed) || (clickPressed && !lastArcadeUiClickPressed);
            if (activatePressed && items[currentArcadeMenuIndex]) {
                items[currentArcadeMenuIndex].click();
            }

            lastArcadeUiLeftPressed = leftPressed;
            lastArcadeUiRightPressed = rightPressed;
            lastArcadeUiSelectPressed = selectPressed;
            lastArcadeUiClickPressed = clickPressed;
        }

        function gameLoop(now) {
            if (window._winAnimationStarted) {
                AtualizarBotaoReturnArcade();
                AtualizarCalibracaoGamepad();
                AtualizarNavegacaoMenuArcade();
                requestAnimationFrame(gameLoop);
                return;
            }

            const frameDelta = Math.min(now - lastFrameTime, MAX_FRAME_DELTA);
            lastFrameTime = now;
            accumulator += frameDelta;

            let updates = 0;
            while (accumulator >= FIXED_STEP && updates < MAX_UPDATES_PER_FRAME) {
                AtualizarPassoJogo();
                accumulator -= FIXED_STEP;
                updates++;
            }
            if (updates === MAX_UPDATES_PER_FRAME) {
                accumulator = 0;
            }
            AtualizarBotaoReturnArcade();
            AtualizarCalibracaoGamepad();
            AtualizarHudJogo();
            requestAnimationFrame(gameLoop); //pede a proxima frame de animaçao do jogo
        }

        AtualizarHudJogo();
        requestAnimationFrame(gameLoop); //começa o jogo


    };

    //captura de inputs
    window.keys = {};

    function CampoTextoAtivo() {
        const el = document.activeElement;
        if (!el) return false;
        const tag = (el.tagName || "").toLowerCase();
        if (tag === "textarea" || tag === "select") return true;
        if (tag === "input") {
            const type = (el.type || "text").toLowerCase();
            return type !== "hidden" && type !== "button" && type !== "submit" && type !== "reset" && type !== "checkbox" && type !== "radio";
        }
        return !!el.isContentEditable;
    }

    function StartAudioOnFirstInput() { //garante audio apos primeira interaçao
        if (window._audioStarted) return;
        window._audioStarted = true;
        const mainGameMusic = document.getElementById('MainGameMusic');
        if (mainGameMusic && mainGameMusic.paused) {
            mainGameMusic.play();
        }
    }

    window.addEventListener("keydown", e => { //regista a tecla pressionada
        if (OverlayCalibracaoAtivo() || CampoTextoAtivo()) return;
        window.keys[e.key.toLowerCase()] = true;
        StartAudioOnFirstInput();
    });

    window.addEventListener("keyup", e => { //regista a tecla largada
        if (OverlayCalibracaoAtivo() || CampoTextoAtivo()) return;
        window.keys[e.key.toLowerCase()] = false;
    });

    </script>

    
</body>
